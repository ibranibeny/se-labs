<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback for GitHub Pages. The app uses hash routing, so any
      // unknown non-hash path is sent back to the app root (the catalog),
      // preserving a hash route if one is present.
      (function () {
        var base = '/se-labs/';
        window.location.replace(base + window.location.hash);
      })();
    </script>
  </head>
  <body>
    Redirecting to the <a href="/se-labs/">SE Asset Portal</a>…
  </body>
</html>
